name: Aktualizacja rozkładów MPK (GTFS ZTP Kraków)
on:
  schedule:
    # Uruchamiaj raz dziennie o 03:30 UTC (04:30 / 05:30 czasu polskiego)
    - cron: '30 3 * * *'
  workflow_dispatch:
jobs:
  update-gtfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Zsynchronizuj rozkłady jazdy z GTFS ZTP Kraków
        run: python scripts/sync_gtfs.py
      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizacja rozkładów MPK z GTFS [skip ci]" && git push)
