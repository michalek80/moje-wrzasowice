ame: Aktualizacja statusu mediów (Prąd, Woda, Gaz)
on:
  schedule:
    # Uruchamiaj automatycznie co 6 godzin
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  update-outages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pobierz dane o mediach (Prąd, Woda, Gaz)
        run: python scripts/fetch_utilities.py
      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/outages.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizacja statusu mediów (Prąd, Woda, Gaz) [skip ci]" && git push)
